<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Valetholic OPS</title>
    <link rel="stylesheet"href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="ops.css">

</head>

<body>

<div class="ops-container">

    <header class="ops-header">

        <div>

            <h1>VALETHOLIC</h1>

            <p>Operations Centre</p>

        </div>

        <button class="logout-btn">

            Logout

        </button>

    </header>

    <section class="overview">

    <div class="stat-card pending">

        <small>Pending Jobs</small>

        <span id="pendingCount">0</span>

    </div>

    <div class="stat-card onduty">

        <small>Drivers On Duty</small>

        <span id="dutyCount">0</span>

    </div>

    <div class="stat-card active">

        <small>Active Jobs</small>

        <span id="activeCount">0</span>

    </div>

    <div class="stat-card complete">

        <small>Completed Today</small>

        <span id="completeCount">0</span>

    </div>

</section>

<section class="map-panel">

    <h2>🛰️ Live Driver Map</h2>

    <div id="driverMap"></div>

</section>

<div class="dashboard-grid">

    <section class="dispatch-panel">

        <h2>

            Dispatch Queue

        </h2>

        <div id="dispatchList"></div>

    </section>

    <section class="drivers-panel">

        <h2>

            Drivers

        </h2>

        <div id="driverList"></div>

    </section>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="supabase.js"></script>

<script src="ops.js"></script>

</body>

</html>
