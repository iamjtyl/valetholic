<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Valetholic OPS</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="ops.css">

</head>

<body>

<div class="ops-container">

    <!-- HEADER -->

    <header class="ops-header">

        <div>

            <h1>VALETHOLIC</h1>

            <p>Slaver</p>

        </div>

        <button class="logout-btn">

            Logout

        </button>

    </header>

    <!-- NAVIGATION -->

    <nav class="ops-nav">

        <a href="#" class="active">Dashboard</a>

        <a href="#">Bookings</a>

        <a href="#">Drivers</a>

        <a href="#">Customers</a>

        <a href="#">Settings</a>

    </nav>

    <!-- OVERVIEW -->

    <section class="overview">

       <div class="stat-card pending">

    <small>Pending Assignment</small>

    <span>3</span>

</div>

<div class="stat-card onduty">

    <small>Drivers On Duty</small>

    <span>6</span>

</div>

<div class="stat-card active">

    <small>Active Jobs</small>

    <span>4</span>

</div>

<div class="stat-card complete">

    <small>Completed Today</small>

    <span>18</span>

</div>
    <!-- DISPATCH QUEUE -->

    <section class="queue">

        <h2>

            Dispatch Queue

        </h2>

        <div class="booking-card">

            <div>

                <strong>

                    Booking #25001

                </strong>
<p>

Eric Tan

</p>

<span class="badge pending">

Pending Assignment

</span>
<span class="badge active">

Customer On Board

</span>

                <p>

                    Marina Bay Sands → Tampines

                </p>

            </div>

            <button class="gold-btn">

                OPEN

            </button>

        </div>

        <div class="booking-card">

            <div>

                <strong>

                    Booking #25002

                </strong>

                <p>

                    Jacqueline Lim

                </p>

                <p>

                    Orchard → Changi

                </p>

            </div>

            <button class="gold-btn">

                OPEN

            </button>

        </div>

    </section>

</div>

<script src="ops.js"></script>

</body>

</html>
