<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Driver Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="dashboard.css">

</head>

<body>
<div class="status-screen">

    <div class="status-card">

        <div class="status-icon">

            ⚪

        </div>

        <h1 id="statusTitle">

            OFF DUTY

        </h1>

        <p id="statusMessage">

            You're currently offline.

            <br><br>

            Go on duty whenever you're ready
            to receive dispatches.

        </p>

        <button
            id="dutyBtn"
            class="gold-btn">

            GO ON DUTY

        </button>

    </div>

</div>

<script src="dashboard.js"></script>
</body>

</html>
