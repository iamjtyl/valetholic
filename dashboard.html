<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================
         BASIC SETTINGS
    ====================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0F0F0F"
    >

    <meta
        name="description"
        content="Valetholic Driver Dashboard"
    >

    <title>Valetholic Driver Dashboard</title>


    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         DASHBOARD CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="dashboard.css"
    >


    <!-- =====================================
         DRIVER TOP BAR
         This overrides older CSS rules
         so the greeting and logout button
         stay beside each other.
    ====================================== -->

    <style>

        /* =================================
           TOP BAR
        ================================= */

        .driver-topbar {

            position: fixed !important;

            top: 18px !important;

            right: 25px !important;

            left: auto !important;

            bottom: auto !important;

            z-index: 999999 !important;

            display: flex !important;

            flex-direction: row !important;

            align-items: center !important;

            justify-content: flex-end !important;

            gap: 14px !important;

            width: auto !important;

            height: auto !important;

            margin: 0 !important;

            padding: 0 !important;

            box-sizing: border-box !important;

        }


        /* =================================
           GREETING
        ================================= */

        .driver-topbar .driver-greeting {

            position: relative !important;

            top: auto !important;

            right: auto !important;

            bottom: auto !important;

            left: auto !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            flex: 0 0 auto !important;

            width: auto !important;

            min-width: max-content !important;

            max-width: none !important;

            height: 48px !important;

            min-height: 48px !important;

            margin: 0 !important;

            padding: 0 18px !important;

            box-sizing: border-box !important;

            white-space: nowrap !important;

            overflow: visible !important;

            color: #D4AF37 !important;

            background: rgba(20,20,20,.96) !important;

            border: 1px solid rgba(212,175,55,.25) !important;

            border-radius: 14px !important;

            font-family: "Inter", sans-serif !important;

            font-size: 17px !important;

            font-weight: 700 !important;

            line-height: 1 !important;

            letter-spacing: .2px !important;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.30);

        }


        /* =================================
           LOG OUT BUTTON
        ================================= */

        .driver-topbar .logout-btn {

            position: relative !important;

            top: auto !important;

            right: auto !important;

            bottom: auto !important;

            left: auto !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            flex: 0 0 auto !important;

            width: auto !important;

            min-width: 105px !important;

            max-width: none !important;

            height: 48px !important;

            min-height: 48px !important;

            margin: 0 !important;

            padding: 0 18px !important;

            box-sizing: border-box !important;

            white-space: nowrap !important;

            overflow: visible !important;

            border: 1px solid #D4AF37 !important;

            border-radius: 14px !important;

            background: #1A1A1A !important;

            color: #FFFFFF !important;

            font-family: "Inter", sans-serif !important;

            font-size: 13px !important;

            font-weight: 800 !important;

            letter-spacing: .7px !important;

            line-height: 1 !important;

            cursor: pointer !important;

            opacity: 1 !important;

            visibility: visible !important;

            z-index: 999999 !important;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.30);

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease,
                box-shadow .2s ease;

        }


        /* =================================
           LOGOUT HOVER
        ================================= */

        .driver-topbar .logout-btn:hover {

            background: #D4AF37 !important;

            color: #111 !important;

            transform: translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(212,175,55,.25);

        }


        /* =================================
           LOGOUT CLICK
        ================================= */

        .driver-topbar .logout-btn:active {

            transform: translateY(0);

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 650px) {

            .driver-topbar {

                top: 12px !important;

                right: 12px !important;

                gap: 8px !important;

                max-width:
                    calc(100vw - 24px) !important;

            }


            .driver-topbar .driver-greeting {

                height: 42px !important;

                min-height: 42px !important;

                padding: 0 12px !important;

                font-size: 14px !important;

            }


            .driver-topbar .logout-btn {

                min-width: 82px !important;

                height: 42px !important;

                min-height: 42px !important;

                padding: 0 12px !important;

                font-size: 11px !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         DRIVER TOP BAR
    ====================================== -->

    <div class="driver-topbar">


        <!-- DRIVER GREETING -->

        <div
            id="driverGreeting"
            class="driver-greeting"
        >

            Hi 👋

        </div>


        <!-- LOG OUT -->

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
        >

            LOG OUT

        </button>


    </div>



    <!-- =====================================
         DRIVER DASHBOARD
    ====================================== -->

    <main
        class="dashboard"
        aria-label="Valetholic Driver Dashboard"
    >


        <!-- =================================
             DRIVER STATUS
        ================================== -->

        <section
            class="status-card"
            aria-labelledby="statusTitle"
        >


            <div
                id="statusIcon"
                class="status-icon"
                aria-hidden="true"
            >

                ⚪

            </div>


            <h1 id="statusTitle">

                OFF DUTY

            </h1>


            <p id="statusMessage">

                You're currently offline.

                <br><br>

                Go on duty whenever you're ready
                to receive dispatches.

            </p>


            <button
                id="dutyBtn"
                class="gold-btn"
                type="button"
            >

                GO ON DUTY

            </button>


        </section>



        <!-- =================================
             DRIVER JOB QUEUE
        ================================== -->

        <section
            id="jobList"
            class="job-list"
            aria-label="Assigned jobs"
            aria-live="polite"
        >

        </section>


    </main>



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================
         SUPABASE CONFIG
    ====================================== -->

    <script
        src="supabase.js"
    ></script>


    <!-- =====================================
         DRIVER DASHBOARD LOGIC
    ====================================== -->

    <script
        src="dashboard.js"
    ></script>


</body>

</html>
