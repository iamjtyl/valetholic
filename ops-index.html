<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================
         BASIC SETTINGS
    ====================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0F0F0F"
    >

    <meta
        name="description"
        content="Valetholic Operations Centre Login"
    >

    <title>
        Valetholic | OPS Login
    </title>


    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         OPS CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="ops.css"
    >

</head>


<body>


    <!-- =====================================
         OPS LOGIN
    ====================================== -->

    <main class="login-container">


        <section
            class="login-card"
            aria-labelledby="loginTitle"
        >


            <!-- =============================
                 LOGO
            ============================== -->

            <img
                src="images/logo.png"
                class="logo"
                alt="Valetholic Logo"
            >


            <!-- =============================
                 BRAND
            ============================== -->

            <h1 id="loginTitle">
                VALETHOLIC
            </h1>


            <p class="login-subtitle">
                Operations Centre
            </p>


            <!-- =============================
                 LOGIN FORM
            ============================== -->

            <form id="opsLoginForm">


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="opsUsername">
                        Username
                    </label>


                    <input
                        id="opsUsername"
                        name="username"
                        type="text"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="opsPassword">
                        Password
                    </label>


                    <input
                        id="opsPassword"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    id="opsLoginBtn"
                    class="gold-btn"
                    type="submit"
                >

                    LOGIN

                </button>


            </form>


            <!-- =============================
                 ERROR / STATUS
            ============================== -->

            <p
                id="opsLoginMessage"
                class="login-message"
                aria-live="polite"
            ></p>


        </section>


    </main>



    <!-- =====================================
         OPS LOGIC
    ====================================== -->

    <script
        src="ops.js"
    ></script>


</body>

</html>
