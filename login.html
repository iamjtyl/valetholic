<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valetholic Admin Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-box">

    <img src="images/logo.png" class="logo">

    <h1>VALETHOLIC</h1>

    <p>Secure Login</p>

    <input
        id="username"
        type="text"
        placeholder="Username">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button onclick="login()">

        LOGIN

    </button>

    <p id="error"></p>

</div>

<script src="login.js"></script>

</body>

</html>
