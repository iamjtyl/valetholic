<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================
         BASIC SETTINGS
    ====================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0B0B0B"
    >

    <meta
        name="description"
        content="Valetholic Admin Login"
    >

    <title>
        Valetholic Admin Login
    </title>


    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         LOGIN CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <!-- =====================================
         ADMIN LOGIN
    ====================================== -->

    <main
        class="login-box"
        aria-labelledby="loginTitle"
    >


        <!-- LOGO -->

        <img
            src="images/logo.png"
            class="logo"
            alt="Valetholic Logo"
        >


        <!-- TITLE -->

        <h1 id="loginTitle">
            VALETHOLIC
        </h1>


        <p>
            Secure Login
        </p>



        <!-- USERNAME -->

        <label
            for="username"
            class="sr-only"
        >
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >



        <!-- PASSWORD -->

        <label
            for="password"
            class="sr-only"
        >
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >



        <!-- LOGIN -->

        <button
            type="button"
            onclick="login()"
        >

            LOGIN

        </button>



        <!-- ERROR -->

        <p
            id="error"
            role="alert"
            aria-live="polite"
        ></p>


    </main>



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="supabase.js"
    ></script>


    <!-- =====================================
         LOGIN LOGIC
    ====================================== -->

    <script
        src="login.js"
    ></script>


</body>

</html>
