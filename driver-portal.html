<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================
         BASIC SETTINGS
    ====================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0B0B0B"
    >

    <meta
        name="description"
        content="Valetholic Driver Hub"
    >

    <title>
        Valetholic Driver Hub
    </title>


    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         DRIVER PORTAL CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="driver-portal.css"
    >


    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================
         SUPABASE CONFIG
    ====================================== -->

    <script
        src="supabase.js"
    ></script>

</head>


<body>


    <!-- =====================================
         DRIVER PORTAL
    ====================================== -->

    <main
        class="portal-container"
        aria-label="Valetholic Driver Hub"
    >


        <section
            class="portal-card"
        >


            <!-- =================================
                 LOGO / BRANDING
            ================================== -->

            <div class="logo">

                <img
                    src="images/logo.png"
                    alt="Valetholic Logo"
                >


                <h1>
                    VALETHOLIC
                </h1>


                <p>
                    I'm ready to earn big bucks
                </p>

            </div>



            <!-- =================================
                 LOGIN / REGISTER SWITCH
            ================================== -->

            <div
                class="switch"
                role="tablist"
                aria-label="Driver account options"
            >


                <button
                    type="button"
                    class="switch-btn active"
                    id="loginTab"
                    role="tab"
                    aria-selected="true"
                    aria-controls="loginForm"
                >

                    Login

                </button>


                <button
                    type="button"
                    class="switch-btn"
                    id="registerTab"
                    role="tab"
                    aria-selected="false"
                    aria-controls="registerForm"
                >

                    Register

                </button>


            </div>



            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <div
                id="loginForm"
                role="tabpanel"
            >


                <!-- EMAIL -->

                <div class="input-group">

                    <label
                        for="loginEmail"
                    >
                        Email
                    </label>


                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label
                        for="loginPassword"
                    >
                        Password
                    </label>


                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                </div>



                <!-- LOGIN OPTIONS -->

                <div class="login-options">


                    <label>

                        <input
                            id="rememberMe"
                            type="checkbox"
                        >

                        Remember Me

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>


                </div>



                <!-- LOGIN BUTTON -->

                <button
                    id="loginBtn"
                    class="gold-btn"
                    type="button"
                >

                    LOGIN

                </button>


            </div>



            <!-- =================================
                 REGISTER FORM
            ================================== -->

            <div
                id="registerForm"
                role="tabpanel"
                style="display:none;"
            >


                <!-- FULL NAME -->

                <div class="input-group">

                    <label
                        for="regName"
                    >
                        Full Name
                    </label>


                    <input
                        id="regName"
                        type="text"
                        placeholder="Your full name"
                        autocomplete="name"
                    >

                </div>



                <!-- MOBILE -->

                <div class="input-group">

                    <label
                        for="regMobile"
                    >
                        Mobile Number
                    </label>


                    <input
                        id="regMobile"
                        type="tel"
                        placeholder="+65"
                        autocomplete="tel"
                    >

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label
                        for="regEmail"
                    >
                        Email Address
                    </label>


                    <input
                        id="regEmail"
                        type="email"
                        placeholder="Email address"
                        autocomplete="email"
                    >

                </div>



                <!-- LICENCE -->

                <div class="input-group">

                    <label
                        for="regLicence"
                    >
                        Licence Type
                    </label>


                    <select
                        id="regLicence"
                    >

                        <option value="Class 3">
                            Class 3
                        </option>

                        <option value="Class 3A">
                            Class 3A
                        </option>

                    </select>

                </div>



                <!-- OWN VEHICLE -->

                <div class="input-group">

                    <label
                        for="regVehicle"
                    >
                        Own Vehicle?
                    </label>


                    <select
                        id="regVehicle"
                    >

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label
                        for="regPassword"
                    >
                        Password
                    </label>


                    <input
                        id="regPassword"
                        type="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label
                        for="regConfirmPassword"
                    >
                        Confirm Password
                    </label>


                    <input
                        id="regConfirmPassword"
                        type="password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                    >

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    id="registerBtn"
                    class="gold-btn"
                    type="button"
                >

                    CREATE ACCOUNT

                </button>


            </div>


        </section>


    </main>



    <!-- =====================================
         DRIVER PORTAL LOGIC
    ====================================== -->

    <script
        src="driver-portal.js"
    ></script>


</body>

</html>
