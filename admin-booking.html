    <!-- =====================================
         SMALL PAGE-SPECIFIC POLISH
    ====================================== -->

    <style>

        /* =================================
           PAGE HEADER
        ================================= */

        .booking-page-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

        }


        .booking-page-header h1 {

            margin: 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 34px;

            font-weight: 600;

            line-height: 1.1;

        }


        .booking-page-header p {

            margin-top: 7px;

            color: #888;

            font-size: 14px;

            line-height: 1.5;

        }


        /* =================================
           TABLE CONTROLS
        ================================= */

        .table-controls {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .table-controls select,
        .table-controls input {

            min-height: 44px;

            padding: 0 13px;

            background: #111;

            color: #fff;

            border:
                1px solid #333;

            border-radius: 10px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .table-controls select:focus,
        .table-controls input:focus {

            border-color: #D4AF37;

            box-shadow:
                0 0 0 3px
                rgba(212,175,55,.12);

        }


        .table-controls input {

            width: 210px;

        }


        /* =================================
           BOOKING TABLE
        ================================= */

        .booking-table-wrapper {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

        }


        .booking-table-wrapper table {

            min-width: 1050px;

        }


        /* =================================
           STATUS BADGES
        ================================= */

        .booking-status {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 78px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .3px;

            white-space: nowrap;

        }


        .booking-status.pending {

            color: #E1BF59;

            background:
                rgba(212,175,55,.10);

            border:
                1px solid
                rgba(212,175,55,.25);

        }


        .booking-status.on-job {

            color: #7EC8FF;

            background:
                rgba(60,140,210,.10);

            border:
                1px solid
                rgba(60,140,210,.25);

        }


        .booking-status.completed {

            color: #6ED69B;

            background:
                rgba(63,166,107,.10);

            border:
                1px solid
                rgba(63,166,107,.25);

        }


        .booking-status.cancelled {

            color: #F08080;

            background:
                rgba(180,35,35,.10);

            border:
                1px solid
                rgba(180,35,35,.25);

        }


        .booking-status.default {

            color: #BDBDBD;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.10);

        }


        /* =================================
           ACTION BUTTONS
        ================================= */

        .booking-actions {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            white-space: nowrap;

        }


        .booking-actions button {

            min-height: 38px;

            padding:
                8px 13px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

        }


        .booking-actions .view-btn {

            background: #D4AF37;

            color: #111;

        }


        .booking-actions .delete-btn {

            background: #B42323;

            color: #fff;

        }


        .booking-actions .delete-btn:hover {

            background: #D64545;

        }


        /* =================================
           LOADING / EMPTY
        ================================= */

        .booking-message {

            padding: 35px 20px !important;

            color: #888 !important;

            text-align: center !important;

        }


        /* =================================
           MOBILE
        ================================= */

        @media (
            max-width: 768px
        ) {

            .booking-page-header {

                align-items: stretch;

                flex-direction: column;

                gap: 12px;

            }


            .booking-page-header h1 {

                font-size: 30px;

            }


            .table-controls {

                width: 100%;

                flex-direction: column;

                align-items: stretch;

            }


            .table-controls select,
            .table-controls input {

                width: 100%;

            }


            /*
             * On mobile the table becomes
             * the vertical booking-card layout
             * supplied by admin.css.
             */

            .booking-table-wrapper {

                overflow-x: visible;

            }


            .booking-table-wrapper table {

                min-width: 0;

            }


            .booking-actions {

                justify-content: flex-end;

                width: 100%;

            }


            .booking-actions button {

                min-width: 82px;

            }

        }


        /* =================================
           SMALL MOBILE
        ================================= */

        @media (
            max-width: 480px
        ) {

            .booking-page-header h1 {

                font-size: 27px;

            }


            .booking-page-header p {

                font-size: 13px;

            }


            .booking-actions {

                gap: 5px;

            }


            .booking-actions button {

                min-width: 74px;

                padding:
                    8px 10px;

                font-size: 10px;

            }

        }

    </style>

</head>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="supabase.js"
></script>



<script>


// =====================================
// LOGIN CHECK
// =====================================

if (
    sessionStorage.getItem(
        "adminLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "login.html";

}


// =====================================
// DOM ELEMENTS
// =====================================

const bookingTable =
    document.getElementById(
        "bookingTable"
    );


const statusFilter =
    document.getElementById(
        "statusFilter"
    );


const searchBooking =
    document.getElementById(
        "searchBooking"
    );


const logoutLink =
    document.getElementById(
        "logoutLink"
    );


// =====================================
// SEARCH DEBOUNCE
// =====================================
//
// Prevents loadBookings() from firing
// repeatedly while the user is typing.
//

let searchTimer = null;


if (
    searchBooking
) {

    searchBooking.addEventListener(
        "input",
        function () {

            clearTimeout(
                searchTimer
            );


            searchTimer =
                setTimeout(
                    () => {

                        loadBookings();

                    },
                    180
                );

        }
    );

}


// =====================================
// STATUS FILTER
// =====================================

if (
    statusFilter
) {

    statusFilter.addEventListener(
        "change",
        loadBookings
    );

}


// =====================================
// LOGOUT
// =====================================

if (
    logoutLink
) {

    logoutLink.addEventListener(
        "click",
        function (
            event
        ) {

            event.preventDefault();

            logout();

        }
    );

}


// =====================================
// LOAD BOOKINGS
// =====================================

async function loadBookings() {


    if (
        !bookingTable
    ) {

        return;

    }


    // =================================
    // LOADING STATE
    // =================================

    bookingTable.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="booking-message"
            >

                Loading bookings...

            </td>

        </tr>

    `;


    // =================================
    // SEARCH
    // =================================

    const keyword =
        (
            searchBooking?.value ||
            ""
        )
        .toLowerCase()
        .trim();


    // =================================
    // STATUS
    // =================================

    const selectedStatus =
        statusFilter?.value ||
        "All";


    try {


        // =================================
        // LOAD BOOKINGS
        // =================================

        const {
            data: bookings,
            error
        } =
            await window.supabaseClient
                .from("Bookings")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                );


        // =================================
        // BOOKING ERROR
        // =================================

        if (
            error
        ) {

            throw error;

        }


        // =================================
        // LOAD DRIVERS
        // =================================

        const {
            data: drivers,
            error: driverError
        } =
            await window.supabaseClient
                .from("Drivers")
                .select(
                    "id, auth_id, name"
                );


        if (
            driverError
        ) {

            console.error(
                "Driver loading error:",
                driverError
            );

        }


        const driverList =
            drivers || [];


        // =================================
        // FILTER
        // =================================

        const filteredBookings =
            (
                bookings ||
                []
            )
            .filter(
                booking => {


                    const customer =
                        String(
                            booking.customer_name ||
                            ""
                        )
                        .toLowerCase();


                    const mobile =
                        String(
                            booking.mobile ||
                            ""
                        )
                        .toLowerCase();


                    const reference =
                        (
                            "vh-" +
                            String(
                                booking.reference_no ||
                                ""
                            )
                        )
                        .toLowerCase();


                    const pickupText =
                        getSearchableLocationText(
                            booking.pickups
                        );


                    const destinationText =
                        getSearchableLocationText(
                            booking.destinations
                        );


                    const status =
                        String(
                            booking.status ||
                            ""
                        )
                        .toLowerCase();


                    // -------------------------
                    // SEARCH MATCH
                    // -------------------------

                    const matchesSearch =

                        customer.includes(
                            keyword
                        )

                        ||

                        mobile.includes(
                            keyword
                        )

                        ||

                        reference.includes(
                            keyword
                        )

                        ||

                        pickupText.includes(
                            keyword
                        )

                        ||

                        destinationText.includes(
                            keyword
                        )

                        ||

                        status.includes(
                            keyword
                        );


                    // -------------------------
                    // STATUS MATCH
                    // -------------------------

                    const matchesStatus =

                        selectedStatus ===
                            "All"

                        ||

                        booking.status ===
                            selectedStatus;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            );


        // =================================
        // EMPTY
        // =================================

        if (
            filteredBookings.length ===
            0
        ) {

            bookingTable.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="booking-message"
                    >

                        No bookings found.

                    </td>

                </tr>

            `;


            return;

        }


        // =================================
        // RENDER
        // =================================

        bookingTable.innerHTML =
            "";


        const fragment =
            document.createDocumentFragment();


        filteredBookings.forEach(
            booking => {


                // =================================
                // LOCATION TEXT
                // =================================

                const pickup =
                    formatLocations(
                        booking.pickups
                    );


                const destination =
                    formatLocations(
                        booking.destinations
                    );


                // =================================
                // DRIVER
                // =================================

                const driver =
                    driverList.find(
                        item =>
                            item.auth_id ===
                            booking.driver_id
                    );


                const driverName =
                    driver
                        ? driver.name
                        : "Unassigned";


                // =================================
                // ROW
                // =================================

                const row =
                    document.createElement(
                        "tr"
                    );


                // =================================
                // REFERENCE
                // =================================

                row.appendChild(
                    createCell(
                        "VH-" +
                        (
                            booking.reference_no ||
                            "----"
                        )
                    )
                );


                // =================================
                // CUSTOMER
                // =================================

                row.appendChild(
                    createCell(
                        booking.customer_name ||
                        "-"
                    )
                );


                // =================================
                // MOBILE
                // =================================

                row.appendChild(
                    createCell(
                        booking.mobile ||
                        "-"
                    )
                );


                // =================================
                // PICKUP
                // =================================

                row.appendChild(
                    createCell(
                        pickup,
                        true
                    )
                );


                // =================================
                // DESTINATION
                // =================================

                row.appendChild(
                    createCell(
                        destination,
                        true
                    )
                );


                // =================================
                // DATE
                // =================================

                row.appendChild(
                    createCell(
                        booking.booking_date ||
                        "-"
                    )
                );


                // =================================
                // STATUS
                // =================================

                const statusCell =
                    document.createElement(
                        "td"
                    );


                const statusBadge =
                    document.createElement(
                        "span"
                    );


                statusBadge.className =
                    `booking-status ${
                        getStatusClass(
                            booking.status
                        )
                    }`;


                statusBadge.textContent =
                    booking.status ||
                    "-";


                statusCell.appendChild(
                    statusBadge
                );


                row.appendChild(
                    statusCell
                );


                // =================================
                // DRIVER
                // =================================

                row.appendChild(
                    createCell(
                        driverName
                    )
                );


                // =================================
                // ACTIONS
                // =================================

                const actionCell =
                    document.createElement(
                        "td"
                    );


                const actions =
                    document.createElement(
                        "div"
                    );


                actions.className =
                    "booking-actions";


                // OPEN

                const openButton =
                    document.createElement(
                        "button"
                    );


                openButton.type =
                    "button";


                openButton.className =
                    "view-btn";


                openButton.textContent =
                    "OPEN";


                openButton.addEventListener(
                    "click",
                    () => {

                        viewBooking(
                            booking.id
                        );

                    }
                );


                // DELETE

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.type =
                    "button";


                deleteButton.className =
                    "delete-btn";


                deleteButton.textContent =
                    "DELETE";


                deleteButton.addEventListener(
                    "click",
                    () => {

                        deleteBooking(
                            booking.id,
                            booking.reference_no
                        );

                    }
                );


                actions.appendChild(
                    openButton
                );


                actions.appendChild(
                    deleteButton
                );


                actionCell.appendChild(
                    actions
                );


                row.appendChild(
                    actionCell
                );


                fragment.appendChild(
                    row
                );

            }
        );


        bookingTable.appendChild(
            fragment
        );


        console.log(
            "BOOKINGS LOADED:",
            filteredBookings.length
        );


    }


    catch (
        error
    ) {

        console.error(
            "Booking loading error:",
            error
        );


        bookingTable.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="booking-message"
                >

                    Unable to load bookings.

                    <br>

                    <small>
                        Please refresh the page
                        and try again.
                    </small>

                </td>

            </tr>

        `;

    }

}


// =====================================
// CREATE TABLE CELL
// =====================================

function createCell(
    value,
    allowLineBreaks = false
) {

    const cell =
        document.createElement(
            "td"
        );


    if (
        allowLineBreaks
    ) {

        const values =
            Array.isArray(value)
                ? value
                : String(
                    value ||
                    "-"
                )
                .split(
                    "\n"
                );


        values.forEach(
            (
                item,
                index
            ) => {

                if (
                    index > 0
                ) {

                    cell.appendChild(
                        document.createElement(
                            "br"
                        )
                    );

                }


                cell.appendChild(
                    document.createTextNode(
                        item
                    )
                );

            }
        );

    }

    else {

        cell.textContent =
            value ||
            "-";

    }


    return cell;

}


// =====================================
// FORMAT LOCATIONS
// =====================================

function formatLocations(
    value
) {

    if (
        Array.isArray(value)
    ) {

        return value.length
            ? value
            : ["-"];

    }


    if (
        typeof value ===
        "string"
    ) {

        try {

            const parsed =
                JSON.parse(
                    value
                );


            if (
                Array.isArray(
                    parsed
                )
            ) {

                return parsed.length
                    ? parsed
                    : ["-"];

            }


        }

        catch {
            // Normal text value.
        }


        return value
            ? [value]
            : ["-"];

    }


    return ["-"];

}


// =====================================
// SEARCHABLE LOCATION TEXT
// =====================================

function getSearchableLocationText(
    value
) {

    return formatLocations(
        value
    )
    .join(" ")
    .toLowerCase();

}


// =====================================
// STATUS CLASS
// =====================================

function getStatusClass(
    status
) {

    switch (
        String(
            status ||
            ""
        )
        .toLowerCase()
    ) {

        case "pending":

            return "pending";


        case "on job":

            return "on-job";


        case "completed":

            return "completed";


        case "cancelled":

            return "cancelled";


        default:

            return "default";

    }

}


// =====================================
// OPEN BOOKING
// =====================================

function viewBooking(
    id
) {

    if (
        !id
    ) {

        return;

    }


    window.location.href =
        `ops-booking.html?id=${
            encodeURIComponent(
                id
            )
        }`;

}


// =====================================
// DELETE BOOKING
// =====================================

async function deleteBooking(
    bookingId,
    referenceNo
) {


    if (
        !bookingId
    ) {

        alert(
            "Booking ID is missing."
        );

        return;

    }


    const displayReference =
        referenceNo
            ? `VH-${referenceNo}`
            : "this booking";


    // =================================
    // CONFIRM
    // =================================

    const confirmed =
        confirm(
            `DELETE ${displayReference}?\n\n` +
            `This action cannot be undone.`
        );


    if (
        !confirmed
    ) {

        return;

    }


    // =================================
    // DELETE
    // =================================

    try {

        const {
            error
        } =
            await window.supabaseClient
                .from("Bookings")
                .delete()
                .eq(
                    "id",
                    bookingId
                );


        if (
            error
        ) {

            throw error;

        }


        alert(
            `${displayReference} has been deleted.`
        );


        await loadBookings();

    }


    catch (
        error
    ) {

        console.error(
            "Delete booking error:",
            error
        );


        alert(
            "Unable to delete booking.\n\n" +
            (
                error.message ||
                "Please try again."
            )
        );

    }

}


// =====================================
// LOGOUT
// =====================================

function logout() {

    sessionStorage.removeItem(
        "adminLoggedIn"
    );


    window.location.href =
        "login.html";

}


// =====================================
// START
