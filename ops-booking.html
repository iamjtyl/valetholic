<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Details</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="ops-booking.css">

</head>

<body>

<div class="ops-container">

    <header class="ops-header">

        <div>

    <h1 id="bookingReference">

        VH-0000

    </h1>

    <p id="bookingStatus">

        Pending Assignment

    </p>

</div>

        <button class="logout-btn"
    onclick="window.location.href='ops-dashboard.html'">

            Back

        </button>

    </header>

    <!-- CUSTOMER -->

    <section class="booking-section">

        <h2>Customer</h2>

        <p><strong>Name:</strong>
        <span id="customerName"></span>
        </p>

        <p><strong>Mobile:</strong>
        <span id="customerMobile"></span>
        </p>

    </section>

    <!-- TRIP -->

    <section class="booking-section">

        <h2>Journey</h2>

        <p><strong>Pickup:</strong>
        <span id="pickup"></span>
        </p>

        <p><strong>Destination:</strong>
        <span id="destination"></span>
        </p>

        <p><strong>Time:</strong>
        <span id="bookingTime"></span>
        </p>

    </section>

    <!-- VEHICLE -->

    <section class="booking-section">

        <h2>Vehicle</h2>

        <p><strong>Model:</strong>
        <span id="vehicleModel"></span>
        </p>

        <p><strong>Plate:</strong>
        <span id="vehiclePlate"></span>
        </p>

    </section>

    <!-- DRIVER -->

    <section class="booking-section">

        <h2>Driver</h2>

        <select id="driverSelect">

    <option>Loading drivers...</option>

</select>
    <button
    class="gold-btn"
    id="assignBtn">

    ASSIGN DRIVER

    </button>

        </select>

    </section>

    <!-- STATUS -->

    <section class="booking-section">

        <h2>Status</h2>

        <select>

            <option>Pending Assignment</option>

            <option>Assigned</option>

            <option>Travelling</option>

            <option>Customer On Board</option>

            <option>Completed</option>

        </select>

    </section>

    <!-- REMARKS -->

    <section class="booking-section">

        <h2>Remarks</h2>

        <textarea
            rows="5"
            placeholder="Internal notes..."></textarea>

    </section>

    <button class="gold-btn">

        SAVE CHANGES

    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="ops-booking.js"></script>

</body>

</html>
