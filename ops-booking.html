<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Details</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="ops.css">

</head>

<body>

<div class="ops-container">

    <header class="ops-header">

        <div>

            <h1>BOOKING</h1>

            <p>#250001</p>

        </div>

        <button class="logout-btn">

            Back

        </button>

    </header>

    <!-- CUSTOMER -->

    <section class="booking-section">

        <h2>Customer</h2>

        <p><strong>Name:</strong> Customer Name</p>

        <p><strong>Mobile:</strong> +65 XXXXXXXX</p>

    </section>

    <!-- TRIP -->

    <section class="booking-section">

        <h2>Journey</h2>

        <p><strong>Pickup:</strong> Marina Bay Sands</p>

        <p><strong>Destination:</strong> Tampines</p>

        <p><strong>Time:</strong> 10:30 PM</p>

    </section>

    <!-- VEHICLE -->

    <section class="booking-section">

        <h2>Vehicle</h2>

        <p><strong>Model:</strong> BMW 520i</p>

        <p><strong>Plate:</strong> SXX1234A</p>

    </section>

    <!-- DRIVER -->

    <section class="booking-section">

        <h2>Driver</h2>

        <select>

            <option>Select Driver</option>

            <option>Driver 1</option>

            <option>Driver 2</option>

        </select>

    </section>

    <!-- STATUS -->

    <section class="booking-section">

        <h2>Status</h2>

        <select>

            <option>Pending Assignment</option>

            <option>Assigned</option>

            <option>Travelling</option>

            <option>Customer On Board</option>

            <option>Completed</option>

        </select>

    </section>

    <!-- REMARKS -->

    <section class="booking-section">

        <h2>Remarks</h2>

        <textarea
            rows="5"
            placeholder="Internal notes..."></textarea>

    </section>

    <button class="gold-btn">

        SAVE CHANGES

    </button>

</div>

<script src="ops.js"></script>

</body>

</html>
