<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================
         BASIC SETTINGS
    ====================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#F6F7FB"
    >

    <meta
        name="description"
        content="Valetholic Operations Booking Management"
    >

    <title>
        Valetholic | Booking
    </title>


    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         OPS BOOKING CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="ops-booking.css"
    >

</head>


<body>


    <!-- =====================================
         OPS CONTAINER
    ====================================== -->

    <main class="ops-container">


        <!-- =================================
             HEADER
        ================================== -->

        <header class="ops-header">


            <div>

                <h1>
                    BOOKING
                </h1>


                <p
                    id="bookingReference"
                    aria-label="Booking reference"
                >
                    Loading...
                </p>

            </div>


            <button
                class="logout-btn"
                type="button"
                onclick="history.back()"
            >

                ← Back

            </button>


        </header>



        <!-- =================================
             CUSTOMER
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="customerHeading"
        >


            <h2 id="customerHeading">
                Customer
            </h2>


            <p>

                <strong>
                    Name:
                </strong>

                <span id="customerName">
                    -
                </span>

            </p>


            <p>

                <strong>
                    Mobile:
                </strong>

                <span id="customerMobile">
                    -
                </span>

            </p>


        </section>



        <!-- =================================
             JOURNEY
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="journeyHeading"
        >


            <h2 id="journeyHeading">
                Journey
            </h2>


            <p>

                <strong>
                    Pickup:
                </strong>

                <span id="pickup">
                    -
                </span>

            </p>


            <p>

                <strong>
                    Destination:
                </strong>

                <span id="destination">
                    -
                </span>

            </p>


            <p>

                <strong>
                    Date:
                </strong>

                <span id="bookingDate">
                    -
                </span>

            </p>


            <p>

                <strong>
                    Time:
                </strong>

                <span id="bookingTime">
                    -
                </span>

            </p>


        </section>



        <!-- =================================
             VEHICLE
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="vehicleHeading"
        >


            <h2 id="vehicleHeading">
                Vehicle
            </h2>


            <p>

                <strong>
                    Model:
                </strong>

                <span id="vehicleModel">
                    -
                </span>

            </p>


            <p>

                <strong>
                    Plate:
                </strong>

                <span id="vehiclePlate">
                    -
                </span>

            </p>


        </section>



        <!-- =================================
             DRIVER
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="driverHeading"
        >


            <h2 id="driverHeading">
                Driver
            </h2>


            <label
                for="driverSelect"
                class="field-label"
            >
                Assign Driver
            </label>


            <select
                id="driverSelect"
                aria-label="Select driver"
            >

                <option value="">
                    Select driver
                </option>

            </select>


            <button
                type="button"
                class="gold-btn"
                id="assignBtn"
            >

                ASSIGN DRIVER

            </button>


            <p
                id="driverMessage"
                class="booking-message"
                aria-live="polite"
            ></p>


        </section>



        <!-- =================================
             STATUS
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="statusHeading"
        >


            <h2 id="statusHeading">
                Status
            </h2>


            <label
                for="statusSelect"
                class="field-label"
            >
                Booking Status
            </label>


            <select
                id="statusSelect"
                aria-label="Booking status"
            >

                <option value="Pending">
                    Pending
                </option>

                <option value="ON JOB">
                    ON JOB
                </option>

                <option value="ON THE WAY">
                    ON THE WAY
                </option>

                <option value="PICKED UP">
                    PICKED UP
                </option>

                <option value="COMPLETED">
                    COMPLETED
                </option>

                <option value="CANCELLED">
                    CANCELLED
                </option>

            </select>


        </section>



        <!-- =================================
             REMARKS
        ================================== -->

        <section
            class="booking-section"
            aria-labelledby="remarksHeading"
        >


            <h2 id="remarksHeading">
                Remarks
            </h2>


            <label
                for="remarks"
                class="field-label"
            >
                Internal Notes
            </label>


            <textarea
                id="remarks"
                rows="5"
                placeholder="Internal notes..."
            ></textarea>


        </section>



        <!-- =================================
             SAVE CHANGES
        ================================== -->

        <button
            type="button"
            class="gold-btn save-button"
            id="saveBtn"
        >

            SAVE CHANGES

        </button>


        <p
            id="saveMessage"
            class="save-message"
            aria-live="polite"
        ></p>


    </main>



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="supabase.js"
    ></script>


    <!-- =====================================
         OPS BOOKING LOGIC
    ====================================== -->

    <script
        src="ops-booking.js"
    ></script>


</body>

</html>
