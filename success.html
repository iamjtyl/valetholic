<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Request Submitted | Valetholic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="success.css">

</head>

<body>

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Your Booking Has Been Received</h1>

        <p>

            Thank you for choosing <strong>Valetholic</strong>.

            <br><br>

            We've successfully received your booking request.

            <br><br>

            Our team will review your booking and contact you via WhatsApp shortly.

        </p>

        <div class="booking-id">

            <small>Reference No.</small>

            <span id="referenceNumber"></span>

        </div>

        <div class="success-buttons">

            <a
                href="https://wa.me/6587923386?text=Hello%20Valetholic!%20I'd%20like%20to%20check%20the%20status%20of%20my%20booking."
                target="_blank"
                class="whatsapp-btn">

                💬 Chat on WhatsApp

            </a>

            <a
                href="index.html"
                class="nav-button">

                Return Home

            </a>

        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const ref = params.get("ref");

const bookingData = JSON.parse(localStorage.getItem("bookingData"));

const referenceElement = document.getElementById("referenceNumber");

if (ref) {

    referenceElement.textContent = `VH-${ref}`;

} else if (bookingData && bookingData.reference_no) {

    referenceElement.textContent = `VH-${bookingData.reference_no}`;

} else {

    referenceElement.textContent = "Reference Not Found";

}

</script>

</body>

</html>
