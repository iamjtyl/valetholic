<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valetholic Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">

</head>

<body class="admin-page">

<nav class="navbar">

<div class="logo">

<img src="images/logo.png">

<span>VALETHOLIC ADMIN</span>

</div>
<div class="admin-actions">

    <a href="index.html" class="website-link">

        🌐 Website

    </a>

    <span>|</span>

    <a href="#" class="logout-link" onclick="logout()">

        🚪 Logout

    </a>

</div>
</nav>

<section class="admin-container">

<h1>Dashboard</h1>

<div class="stats">

<div class="stat-card">

<h2 id="totalBookings">0</h2>

<p>Total Bookings</p>

</div>

<div class="stat-card">

<h2 id="pendingBookings">0</h2>

<p>Pending</p>

</div>

<div class="stat-card">

<h2 id="completedBookings">0</h2>

<p>Completed</p>

</div>

<div class="stat-card">

<h2 id="todayBookings">0</h2>

<p>Today's Bookings</p>

</div>

</div>

<div class="table-card">

<div class="table-header">

    <h2>Latest Bookings</h2>

    <div class="table-controls">

        <select
            id="statusFilter"
            onchange="loadDashboard()">

            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>

        </select>

        <input
            type="text"
            id="searchBooking"
            placeholder="🔍 Search..."
            onkeyup="loadDashboard()">

    </div>

</div>

<table>

<thead>
<tr>
    <th>Reference</th>
    <th>Customer</th>
    <th>Mobile</th>
    <th>Pickup</th>
    <th>Destination</th>
    <th>Date</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="bookingTable">

</tbody>

</table>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin.js"></script>
<!-- =========================
BOOKING DETAILS MODAL
========================= -->

<div id="bookingModal" class="modal">

    <div class="modal-content">

        <span class="close-modal">&times;</span>

        <h2>Booking Details</h2>

        <div id="modalBody">

        </div>

    </div>

</div>
</body>

</html>
