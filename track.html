<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Track Your Valetholic Driver
    </title>


    <link
        rel="stylesheet"
        href="styles.css"
    >


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        body {

            margin: 0;

            background: #111;

            color: #fff;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        .tracking-page {

            max-width: 900px;

            margin: 0 auto;

            padding:
                25px 18px 40px;

        }


        .tracking-header {

            text-align: center;

            margin-bottom: 25px;

        }


        .tracking-header h1 {

            margin-bottom: 8px;

        }


        .reference {

            opacity: .7;

            font-size: 16px;

        }


        .status-card {

            background: #1d1d1d;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 20px;

            text-align: center;

        }


        .status-icon {

            font-size: 40px;

            margin-bottom: 8px;

        }


        .status-title {

            font-size: 22px;

            font-weight: 700;

        }


        .status-message {

            margin-top: 8px;

            opacity: .7;

        }


        #map {

            width: 100%;

            height: 60vh;

            min-height: 350px;

            border-radius: 18px;

            overflow: hidden;

            margin-top: 20px;

        }


        .driver-card {

            background: #1d1d1d;

            border-radius: 16px;

            padding: 18px;

            margin-top: 20px;

        }


        .hidden {

            display: none;

        }


        .gps-waiting {

            text-align: center;

            margin-top: 10px;

            opacity: .65;

            font-size: 13px;

        }


    </style>

</head>


<body>


<div class="tracking-page">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="tracking-header">

        <h1>
            🚗 Track Your Valetholic Driver
        </h1>


        <div
            id="reference"
            class="reference"
        >
            Loading...
        </div>

    </div>



    <!-- =========================
         STATUS
    ========================== -->

    <div
        id="statusCard"
        class="status-card"
    >

        <div
            id="statusIcon"
            class="status-icon"
        >
            📍
        </div>


        <div
            id="statusTitle"
            class="status-title"
        >
            Finding your booking...
        </div>


        <div
            id="statusMessage"
            class="status-message"
        >
            Please wait.
        </div>

    </div>



    <!-- =========================
         MAP
    ========================== -->

    <div
        id="map"
        class="hidden"
    ></div>


    <div
        id="gpsWaiting"
        class="gps-waiting hidden"
    >
        📍 Waiting for driver's GPS location...
    </div>



    <!-- =========================
         DRIVER
    ========================== -->

    <div
        id="driverCard"
        class="driver-card hidden"
    >

        <strong>
            Driver
        </strong>


        <div
            id="driverName"
            style="margin-top:8px;"
        >
            -
        </div>

    </div>


</div>



<!-- =========================
     SUPABASE
========================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="supabase.js"
></script>


<!-- =========================
     LEAFLET
========================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<script>

let map = null;

let driverMarker = null;

let refreshTimer = null;

let firstLocation = true;


// =====================================
// TOKEN
// =====================================

const params =
    new URLSearchParams(
        window.location.search
    );


const trackingToken =
    params.get(
        "token"
    );


if (!trackingToken) {

    showError(
        "This tracking link is invalid."
    );

}


// =====================================
// ELEMENTS
// =====================================

const reference =
    document.getElementById(
        "reference"
    );


const statusIcon =
    document.getElementById(
        "statusIcon"
    );


const statusTitle =
    document.getElementById(
        "statusTitle"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const mapElement =
    document.getElementById(
        "map"
    );


const gpsWaiting =
    document.getElementById(
        "gpsWaiting"
    );


const driverCard =
    document.getElementById(
        "driverCard"
    );


const driverName =
    document.getElementById(
        "driverName"
    );


// =====================================
// LOAD TRACKING
// =====================================

async function loadTracking() {

    if (!trackingToken) {

        return;

    }


    const {
        data,
        error
    } =
        await window.supabaseClient
            .rpc(
                "get_driver_tracking",
                {
                    p_tracking_token:
                        trackingToken
                }
            );


    if (error) {

        console.error(
            "Tracking error:",
            error
        );

        showError(
            "Unable to load tracking."
        );

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        showError(
            "This tracking link has expired or is invalid."
        );

        stopTracking();

        return;

    }


    const booking =
        data[0];


    console.log(
        "📍 Tracking data:",
        booking
    );


    updateTracking(
        booking
    );

}


// =====================================
// UPDATE TRACKING
// =====================================

function updateTracking(
    booking
) {

    // =================================
    // REFERENCE
    // =================================

    reference.textContent =
        booking.reference_no
            ? `Booking VH-${booking.reference_no}`
            : "Valetholic Booking";


    // =================================
    // STATUS
    // =================================

    const currentStatus =
        String(
            booking.status ||
            ""
        )
        .trim()
        .toUpperCase();


    // =================================
    // COMPLETED
    // =================================

    if (
        currentStatus ===
        "COMPLETED"
    ) {

        statusIcon.textContent =
            "✅";


        statusTitle.textContent =
            "Journey Completed";


        statusMessage.textContent =
            "Your journey is complete. " +
            "This tracking link remains available for 6 hours.";


        gpsWaiting.classList.add(
            "hidden"
        );


        // Keep final known GPS

        if (
            booking.latitude !== null &&
            booking.longitude !== null
        ) {

            driverCard.classList.remove(
                "hidden"
            );


            driverName.textContent =
                booking.driver_name ||
                "Valetholic Driver";


            showDriverLocation(
                Number(
                    booking.latitude
                ),
                Number(
                    booking.longitude
                )
            );

        }


        return;

    }



    // =================================
    // CANCELLED
    // =================================

    if (
        currentStatus ===
        "CANCELLED"
    ) {

        statusIcon.textContent =
            "❌";


        statusTitle.textContent =
            "Booking Cancelled";


        statusMessage.textContent =
            "Live tracking is no longer available.";


        mapElement.classList.add(
            "hidden"
        );


        gpsWaiting.classList.add(
            "hidden"
        );


        driverCard.classList.add(
            "hidden"
        );


        stopTracking();

        return;

    }



    // =================================
    // NOT STARTED
    // =================================

    if (
        currentStatus ===
            "PENDING" ||
        currentStatus ===
            "ON JOB"
    ) {

        statusIcon.textContent =
            "🕐";


        statusTitle.textContent =
            "Driver Not On The Way Yet";


        statusMessage.textContent =
            "Live tracking will begin when your driver starts the journey.";


        mapElement.classList.add(
            "hidden"
        );


        gpsWaiting.classList.add(
            "hidden"
        );


        driverCard.classList.add(
            "hidden"
        );


        return;

    }



    // =================================
    // LIVE
    // ON THE WAY / PICKED UP
    // =================================

    if (
        currentStatus ===
            "ON THE WAY" ||
        currentStatus ===
            "PICKED UP"
    ) {

        statusIcon.textContent =
            "🚗";


        statusTitle.textContent =
            currentStatus ===
                "PICKED UP"
                ? "Customer On Board"
                : "Your Driver Is On The Way";


        driverCard.classList.remove(
            "hidden"
        );


        driverName.textContent =
            booking.driver_name ||
            "Valetholic Driver";


        // =================================
        // ALWAYS SHOW MAP
        // =================================

        showTrackingMap();


        // =================================
        // GPS AVAILABLE
        // =================================

        if (
            booking.latitude !== null &&
            booking.longitude !== null
        ) {

            statusMessage.textContent =
                "Live location updating.";


            gpsWaiting.classList.add(
                "hidden"
            );


            showDriverLocation(
                Number(
                    booking.latitude
                ),
                Number(
                    booking.longitude
                )
            );

        }


        // =================================
        // GPS NOT AVAILABLE YET
        // =================================

        else {

            statusMessage.textContent =
                "Your driver is active. " +
                "Waiting for GPS location.";


            gpsWaiting.classList.remove(
                "hidden"
            );

        }

    }

}


// =====================================
// SHOW TRACKING MAP
// =====================================

function showTrackingMap() {

    mapElement.classList.remove(
        "hidden"
    );


    if (!map) {

        initialiseMap();

    }


    // Leaflet needs this when a
    // previously hidden map becomes visible.

    setTimeout(
        () => {

            if (map) {

                map.invalidateSize();

            }

        },
        100
    );

}


// =====================================
// INITIALISE MAP
// =====================================

function initialiseMap(
    latitude = 1.3521,
    longitude = 103.8198
) {

    if (map) {

        return;

    }


    map =
        L.map(
            "map"
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {

            maxZoom:
                19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }
    )
    .addTo(
        map
    );


    // Start with Singapore view.

    map.setView(
        [
            latitude,
            longitude
        ],
        12
    );

}


// =====================================
// UPDATE DRIVER LOCATION
// =====================================

function showDriverLocation(
    latitude,
    longitude
) {

    if (
        Number.isNaN(latitude) ||
        Number.isNaN(longitude)
    ) {

        return;

    }


    // Make sure map is visible.

    showTrackingMap();


    const position =
        [
            latitude,
            longitude
        ];


    // =================================
    // CREATE MARKER
    // =================================

    if (!driverMarker) {

        driverMarker =
            L.marker(
                position
            )
            .addTo(
                map
            )
            .bindPopup(
                "🚗 Your Valetholic Driver"
            );


        map.setView(
            position,
            15
        );


        firstLocation =
            false;


        return;

    }


    // =================================
    // MOVE MARKER
    // =================================

    driverMarker.setLatLng(
        position
    );


    // =================================
    // FIRST GPS POSITION
    // =================================

    if (
        firstLocation
    ) {

        map.setView(
            position,
            15
        );


        firstLocation =
            false;

    }

}


// =====================================
// ERROR
// =====================================

function showError(
    message
) {

    statusIcon.textContent =
        "⚠️";


    statusTitle.textContent =
        "Tracking Unavailable";


    statusMessage.textContent =
        message;


    mapElement.classList.add(
        "hidden"
    );


    gpsWaiting.classList.add(
        "hidden"
    );


    driverCard.classList.add(
        "hidden"
    );

}


// =====================================
// STOP TRACKING
// =====================================

function stopTracking() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );


        refreshTimer =
            null;

    }

}


// =====================================
// START
// =====================================

loadTracking();


refreshTimer =
    setInterval(
        loadTracking,
        5000
    );

</script>


</body>

</html>
